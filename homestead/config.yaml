name: Homestead
version: "0.5.0"
slug: homestead
description: >-
  Vegetable garden, greenhouse and orchard: crop calendar, tasks, journal and
  harvests, season after season.
url: https://github.com/antoine28boel/homestead
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:sprout
panel_title: Homestead
homeassistant_api: true
discovery:
  - homestead
watchdog: http://[HOST]:[PORT:8099]/api/health
backup_exclude:
  - "*.tmp"
