id: parsley
names: {en: Parsley, fr: Persil, nl: Peterselie, de: Petersilie}
family: apiaceae
frost: hardy
sow_indoors:
  - {start: -10, end: -4}
sow_direct:
  - {start: -4, end: 8}
transplant:
  - {start: -2, end: 4}
germination_days: [14, 28]
harvest: {after: sowing, days: [70, 90], weeks: 30}
spacing_cm: {plant: 15, row: 25}
rotation_years: 3
companions: [tomato]
tips:
  en:
    - "Slow to come up: soak the seeds overnight before sowing."
    - "Cut the outer stems; it lasts two seasons and goes to seed in the second."
  fr:
    - "Lent à lever : faire tremper les graines une nuit avant de semer."
    - "Couper les tiges extérieures ; il vit deux saisons et monte en graine la deuxième."
