id: pepper
names: {en: Pepper and chilli, fr: Poivron et piment, nl: Paprika en peper, de: Paprika und Chili}
family: solanaceae
frost: tender
sow_indoors:
  - {start: -10, end: -8}
transplant:
  - {start: 2, end: 4}
germination_days: [10, 20]
harvest: {after: transplant, days: [70, 90], weeks: 8}
spacing_cm: {plant: 45, row: 60}
tasks:
  - {id: prick_out, after: sowing, days: 30, methods: [sow_indoors], label: {en: Prick out into pots, fr: Repiquer en godets}}
  - {id: stake, after: transplant, days: 14, label: {en: Stake, fr: Tuteurer}}
rotation_years: 4
companions: [basil, carrot, eggplant, tomato]
tips:
  en:
    - "It needs warmth: in a cool climate, grow it under cover."
    - "Stake heavy plants; the fruit turns red if left longer on the plant."
  fr:
    - "Il a besoin de chaleur : sous un climat frais, le cultiver sous abri."
    - "Tuteurer les pieds chargés ; les fruits rougissent si on les laisse plus longtemps."
