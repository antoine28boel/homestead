id: sweet_corn
names: {en: Sweet corn, fr: Maïs doux, nl: Suikermaïs, de: Zuckermais}
family: poaceae
frost: tender
sow_indoors:
  - {start: -4, end: -2}
sow_direct:
  - {start: 1, end: 4}
transplant:
  - {start: 1, end: 3}
germination_days: [7, 12]
harvest: {after: sowing, days: [80, 100], weeks: 3}
spacing_cm: {plant: 30, row: 60}
tasks:
  - {id: earth_up, after: sowing, days: 40, label: {en: Earth up, fr: Butter}}
rotation_years: 2
companions: [bush_bean, cucumber, melon, pole_bean, squash]
avoid: [tomato]
tips:
  en:
    - "Plant in a block rather than one long row: the wind pollinates it."
    - "Ripe when the silk turns brown and a kernel gives milky juice."
  fr:
    - "Planter en carré plutôt qu'en une longue ligne : c'est le vent qui le pollinise."
    - "Mûr quand les soies brunissent et qu'un grain donne un jus laiteux."
