id: broccoli
names: {en: Broccoli, fr: Brocoli, nl: Broccoli, de: Brokkoli}
family: brassicaceae
frost: hardy
sow_indoors:
  - {start: -8, end: 4}
transplant:
  - {start: -4, end: 8}
germination_days: [5, 10]
harvest: {after: transplant, days: [60, 90], weeks: 4}
spacing_cm: {plant: 45, row: 60}
tasks:
  - {id: prick_out, after: sowing, days: 21, methods: [sow_indoors], label: {en: Prick out into pots, fr: Repiquer en godets}}
  - {id: net, after: transplant, days: 0, label: {en: Cover with insect netting, fr: Protéger avec un filet anti-insectes}}
rotation_years: 4
companions: [beetroot, lettuce, onion]
avoid: [tomato]
tips:
  en:
    - "Cut the central head while the buds are still tight; side shoots follow."
    - "Cover with fine netting against the cabbage white butterfly."
  fr:
    - "Couper la tête centrale quand les boutons sont encore serrés ; des pousses latérales suivent."
    - "Couvrir d'un filet fin contre la piéride du chou."
