    - "It needs heat: in a cool climate, grow it in the greenhouse."
    - "Keep five or six fruits per plant for larger ones."
  fr:
    - "Elle a besoin de chaleur : sous un climat frais, la cultiver en serre."
    - "Garder cinq ou six fruits par pied pour qu'ils grossissent."
