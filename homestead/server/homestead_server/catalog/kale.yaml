id: kale
names: {en: Kale, fr: Chou kale, nl: Boerenkool, de: Grünkohl}
family: brassicaceae
frost: hardy
sow_indoors:
  - {start: -4, end: 6}
transplant:
  - {start: 2, end: 10}
germination_days: [5, 10]
harvest: {after: transplant, days: [55, 75], weeks: 20}
spacing_cm: {plant: 45, row: 60}
tasks:
  - {id: prick_out, after: sowing, days: 21, methods: [sow_indoors], label: {en: Prick out into pots, fr: Repiquer en godets}}
  - {id: net, after: transplant, days: 0, label: {en: Cover with insect netting, fr: Protéger avec un filet anti-insectes}}
rotation_years: 4
companions: [beetroot, onion]
avoid: [tomato]
tips:
  en:
    - "Frost makes the leaves sweeter: harvest it through winter."
    - "Pick the lower leaves first; the top keeps growing."
  fr:
    - "Le gel rend les feuilles plus douces : le récolter tout l'hiver."
    - "Cueillir d'abord les feuilles du bas ; la tête continue de pousser."
