id: tomato
names: {en: Tomato, fr: Tomate, nl: Tomaat, de: Tomate}
family: solanaceae
frost: tender
sow_indoors:
  - {start: -8, end: -6}
transplant:
  - {start: 1, end: 3}
germination_days: [6, 12]
harvest: {after: transplant, days: [60, 85], weeks: 10}
spacing_cm: {plant: 50, row: 70}
tasks:
  - {id: prick_out, after: sowing, days: 21, methods: [sow_indoors], label: {en: Prick out into pots, fr: Repiquer en godets}}
  - {id: stake, after: transplant, days: 7, label: {en: Stake, fr: Tuteurer}}
  - {id: side_shoots, after: transplant, days: 21, label: {en: Remove side shoots, fr: Supprimer les gourmands}}
rotation_years: 4
companions: [basil, carrot, garlic, parsley]
avoid: [potato]
tips:
  en:
    - "Plant deep: roots grow along the buried stem."
    - "Water at the foot, never on the leaves, to limit blight."
  fr:
    - "Planter profond : des racines poussent le long de la tige enterrée."
    - "Arroser au pied, jamais sur les feuilles, pour limiter le mildiou."
